# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Offices (core/src/offices.ts)
        - $ref: '#/components/schemas/OfficesLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
        # Music (feature: features/musica)
        - $ref: '#/components/schemas/MusicNowPlaying'
        - $ref: '#/components/schemas/MusicStatus'
        - $ref: '#/components/schemas/MusicLyrics'
        # Claude usage (feature: features/usage)
        - $ref: '#/components/schemas/UsageStatus'
        # herdr tab names (feature: features/herdr)
        - $ref: '#/components/schemas/HerdrTabLabels'
        # GitHub room (feature: features/github)
        - $ref: '#/components/schemas/GithubStatus'
        # Upcoming concerts (feature: features/conciertos)
        - $ref: '#/components/schemas/ConcertsStatus'
        # Personal agenda (feature: features/agenda)
        - $ref: '#/components/schemas/AgendaStatus'
        # Roof garden (feature: features/jardin)
        - $ref: '#/components/schemas/JardinStatus'
        # Agent searches with criteria (features/busquedas; rooms: features/directorio)
        - $ref: '#/components/schemas/SearchRoomStatus'
        # Outside connections board (feature: features/conexiones)
        - $ref: '#/components/schemas/ConnectionsStatus'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetShadowsEnabled'
        - $ref: '#/components/schemas/SetParticlesEnabled'
        - $ref: '#/components/schemas/SetDayNightMode'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        # Music (feature: features/musica)
        - $ref: '#/components/schemas/SetMusicEnabled'
        - $ref: '#/components/schemas/InstallMusicExtension'
        - $ref: '#/components/schemas/MusicControl'
        - $ref: '#/components/schemas/DisconnectSpotify'
        # Upcoming concerts (feature: features/conciertos)
        - $ref: '#/components/schemas/RefreshConcerts'
        - $ref: '#/components/schemas/SearchConcerts'
        - $ref: '#/components/schemas/AddConcert'
        - $ref: '#/components/schemas/DisconnectGoogle'
        # Personal agenda (feature: features/agenda)
        - $ref: '#/components/schemas/RefreshAgenda'
        - $ref: '#/components/schemas/AddAgendaItem'
        - $ref: '#/components/schemas/CompleteAgendaTask'
        # Roof garden (feature: features/jardin)
        - $ref: '#/components/schemas/RefreshJardin'
        - $ref: '#/components/schemas/SaveJardinPlant'
        - $ref: '#/components/schemas/DeleteJardinPlant'
        - $ref: '#/components/schemas/MarkJardinCare'
        - $ref: '#/components/schemas/SaveJardinSupply'
        - $ref: '#/components/schemas/DeleteJardinSupply'
        - $ref: '#/components/schemas/ResolveJardinInbox'
        # Agent searches with criteria (features/busquedas; rooms: features/directorio)
        - $ref: '#/components/schemas/CreateSearchRequest'
        - $ref: '#/components/schemas/LaunchSearchAgent'
        - $ref: '#/components/schemas/MarkSearchResult'
        - $ref: '#/components/schemas/DeleteSearchRequest'
        - $ref: '#/components/schemas/SaveSearchCriteria'
        - $ref: '#/components/schemas/ScheduleSearchResult'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        profile:
          type: string
          description: Which install of the CLI the session runs under (a Claude Code profile); absent for the default.
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        profiles:
          type: object
          description: Map of agent ID (string) to CLI profile tag (only agents outside the default profile).
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: >-
        Activity state of an agent. "thinking" = the user sent a prompt and the
        agent has not started a tool yet.
      type: string
      enum: [active, thinking, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string
        failed:
          type: boolean
          description: The tool ran and failed (not a user rejection or interrupt). Omitted when it succeeded.

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'
        names:
          type: object
          description: Named sheets (an external dir's or a private pack's assets/characters/<name>.png) → index in `characters`.
          additionalProperties:
            type: integer

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string
        petLightColors:
          type: array
          description: Night-glow colors (`#rrggbb`) parallel-indexed to `pets`, from each manifest's optional `lightColor`; an empty string means the default pet light.
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
        - shadowsEnabled
        - particlesEnabled
        - dayNightMode
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean
        shadowsEnabled:
          type: boolean
        particlesEnabled:
          type: boolean
        dayNightMode:
          $ref: '#/components/schemas/DayNightMode'

    DayNightMode:
      description: >-
        Office lighting: follow the viewer's local clock (auto), or pin it to
        day or night.
      type: string
      enum: [auto, day, night]

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    OfficesLoaded:
      description: >-
        The offices this server has (the main one plus the ones private packs
        declare) and the one this page shows, with the floor of it this page
        shows. Sent first on webviewReady, before any agent, so the page knows
        whose agents to draw (agents are only drawn on the ground floor).
      type: object
      additionalProperties: false
      required: [type, current, offices]
      properties:
        type:
          const: officesLoaded
        current:
          type: string
        floor:
          type: string
          description: Floor of the current office this page shows (core/src/offices.ts); the ground floor ("pb") when absent.
        mainFloors:
          type: array
          description: Floors of the main office besides the ground floor, top floor first.
          items:
            $ref: '#/components/schemas/FloorInfo'
        mainLabel:
          type: string
        mainTitle:
          type: string
        offices:
          type: array
          items:
            $ref: '#/components/schemas/OfficeInfo'

    OfficeInfo:
      type: object
      additionalProperties: false
      required: [id, label, profiles]
      properties:
        id:
          type: string
        label:
          type: string
        title:
          type: string
        profiles:
          type: array
          items:
            type: string
        alsoInMain:
          type: array
          items:
            type: string
        mainProfile:
          type: string
        floors:
          type: array
          description: Floors of this office besides the ground floor, top floor first.
          items:
            $ref: '#/components/schemas/FloorInfo'

    FloorInfo:
      description: A floor of an office besides the ground floor (core/src/offices.ts FloorDef).
      type: object
      additionalProperties: false
      required: [id, level, label]
      properties:
        id:
          type: string
        level:
          type: integer
          description: 1, 2… above the ground floor (0), -1, -2… below it.
        button:
          type: string
          description: Short text on its elevator button (from the level when absent; "AZ" for the roof).
        label:
          type: string
        roof:
          type: boolean
          description: The roof, always the top floor of its building (its level is one above the highest floor).

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady
        office:
          type: string
          description: Office this page shows (core/src/offices.ts); the main office when absent or unknown.
        floor:
          type: string
          description: Floor of that office this page shows; the ground floor when absent or unknown.

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the layout of this page's office and floor to ~/.pixel-agents/ (layout.json for the main office's ground floor).
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetShadowsEnabled:
      description: Toggle the drop shadows under characters, pets and furniture.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShadowsEnabled
        enabled:
          type: boolean

    SetParticlesEnabled:
      description: Toggle ambient particles (coffee steam, sparks, dust).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setParticlesEnabled
        enabled:
          type: boolean

    SetDayNightMode:
      description: Pick the office lighting mode.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: setDayNightMode
        mode:
          $ref: '#/components/schemas/DayNightMode'

    # ── Music (feature: features/musica) ─────────────────────────

    MusicNowPlaying:
      description: >-
        What the music player reports as playing (fed by a Spicetify extension
        through POST /api/music). Without `track`, nothing is playing. Never
        persisted.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: musicNowPlaying
        track:
          $ref: '#/components/schemas/MusicTrack'

    MusicTrack:
      type: object
      additionalProperties: false
      required: [title, artist, isPaused, positionMs, durationMs]
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        cover:
          description: Album cover as a data URL (downloaded by the server, so the canvas stays untainted).
          type: string
        isPaused:
          type: boolean
        positionMs:
          type: number
        durationMs:
          type: number
        device:
          description: >-
            Spotify Connect device it is playing on when that is not this
            computer (e.g. a smart speaker), if the player reports it.
          type: string

    MusicLyrics:
      description: >-
        Lyrics of the current track (Spotify's own through the extension, or
        LRCLIB as a fallback). Without `lines`, there are none. Shown to the
        viewer only; never persisted.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: musicLyrics
        title:
          type: string
        artist:
          type: string
        loading:
          description: Still looking for this song's lyrics (Spotify, then LRCLIB).
          type: boolean
        synced:
          description: Lines carry `timeMs` (the moment each one starts).
          type: boolean
        instrumental:
          description: The song has no lyrics because it is instrumental (LRCLIB says so); comes without `lines`.
          type: boolean
        source:
          type: string
          enum: [spotify, lrclib]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/MusicLyricLine'

    MusicLyricLine:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        timeMs:
          type: number

    # ── Claude usage (feature: features/usage) ─────────────────────

    UsageStatus:
      description: >-
        Claude plan limits (5 hours, week) and each session's estimated cost,
        per Claude Code profile, as saved by the statusline script in
        ~/.pixel-agents/uso/. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, profiles]
      properties:
        type:
          const: usageStatus
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/UsageProfile'

    GithubStatus:
      description: >-
        The GitHub room: the user's repositories (newest push first) with their
        commit count and open pull requests, plus the last weeks of the
        contribution calendar, as `gh` sees them. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, login, totalRepos, repos, pullRequests, weeks, updatedAt]
      properties:
        type:
          const: githubStatus
        login:
          type: string
        totalRepos:
          type: number
        repos:
          type: array
          items:
            $ref: '#/components/schemas/GithubRepo'
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/GithubPullRequest'
        weeks:
          type: array
          description: Contributions per day, oldest week first, 7 days each (Sunday first).
          items:
            type: array
            items:
              type: number
        updatedAt:
          type: string

    GithubRepo:
      type: object
      additionalProperties: false
      required: [name, url, private, stars, commits, openPullRequests]
      properties:
        name:
          type: string
        url:
          type: string
        private:
          type: boolean
        pushedAt:
          type: string
        stars:
          type: number
        commits:
          type: number
          description: Commits on the default branch.
        openPullRequests:
          type: number

    ConcertsStatus:
      description: >-
        Upcoming concerts: the events of the owner's "Conciertos" Google calendar
        whose title starts with "Concierto:", plus concerts found on Ticketmaster
        Mexico for the artists they listen to most. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, googleConfigured, googleConnected, ticketmasterConfigured, concerts, found, searching]
      properties:
        type:
          const: concertsStatus
        googleConfigured:
          type: boolean
          description: The Google client ID and secret are in conciertos.json.
        googleConnected:
          type: boolean
        reconnectInDays:
          type: number
          description: Present when the Google session (7 days for a Testing app) ends soon; 0 = today.
        ticketmasterConfigured:
          type: boolean
        concerts:
          type: array
          items:
            $ref: '#/components/schemas/CalendarConcert'
        found:
          type: array
          items:
            $ref: '#/components/schemas/FoundConcert'
        searching:
          type: boolean
        error:
          type: string

    CalendarConcert:
      type: object
      additionalProperties: false
      required: [id, title, artist, start, allDay]
      properties:
        id:
          type: string
        title:
          type: string
          description: The event title without the "Concierto:" prefix.
        artist:
          type: string
        start:
          type: string
          description: ISO date-time, or YYYY-MM-DD for an all-day event.
        allDay:
          type: boolean
        location:
          type: string
        link:
          type: string

    FoundConcert:
      type: object
      additionalProperties: false
      required: [id, artist, name, start, allDay]
      properties:
        id:
          type: string
        artist:
          type: string
        name:
          type: string
        start:
          type: string
          description: YYYY-MM-DD, plus THH:MM:SS when known (venue local time).
        allDay:
          type: boolean
        venue:
          type: string
        city:
          type: string
        url:
          type: string

    # ── Personal agenda (feature: features/agenda) ────────────────

    AgendaStatus:
      description: >-
        Today and the next days: the events of the shared Google calendar and
        the owner's own Google Tasks (pending ones due in that span, overdue or
        without a date). Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, connected, from, days, items, saving]
      properties:
        type:
          const: agendaStatus
        connected:
          type: boolean
          description: There is a Google session to read the calendar and the tasks with.
        from:
          type: string
          description: First day shown (YYYY-MM-DD, local), today.
        days:
          type: number
          description: How many days are shown, starting at `from`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItem'
        saving:
          type: boolean
          description: Something is being added or marked done right now.
        error:
          type: string

    AgendaItem:
      type: object
      additionalProperties: false
      required: [id, kind, title, allDay]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/AgendaItemKind'
        title:
          type: string
          description: The whole title as written in Google, type prefix included.
        start:
          type: string
          description: >-
            ISO date-time, or YYYY-MM-DD for an all-day event or a task's day.
            Absent for a task without a date.
        end:
          type: string
          description: End of an event (ISO date-time, or YYYY-MM-DD exclusive for all-day ones).
        allDay:
          type: boolean
        location:
          type: string
        link:
          type: string

    AgendaItemKind:
      description: An event of the shared calendar, or a task of the owner's Google Tasks.
      type: string
      enum: [event, task]

    RefreshAgenda:
      description: Read the calendar and the tasks again now. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: refreshAgenda

    AddAgendaItem:
      description: >-
        Add what the owner wrote and confirmed in the panel: an event to the
        shared calendar or a task to Google Tasks. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, kind, title]
      properties:
        type:
          const: addAgendaItem
        kind:
          $ref: '#/components/schemas/AgendaItemKind'
        title:
          type: string
          description: The whole title, with the type prefix for events (Salida, Concierto…).
        date:
          type: string
          description: YYYY-MM-DD (local). Required for events; optional for tasks.
        time:
          type: string
          description: HH:MM (local) for an event with a time; absent = all-day.
        endTime:
          type: string
          description: HH:MM (local) end of a timed event; absent = one hour later.

    CompleteAgendaTask:
      description: Mark a task (its id in agendaStatus.items) as done. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: completeAgendaTask
        id:
          type: string

    # ── Roof garden (feature: features/jardin) ─────────────────────

    JardinStatus:
      description: >-
        The roof garden: the plants with their care (the next one worked out
        from the last real one), the garden supplies, what came from the phone
        and could not be read (the inbox), and the state of each link (the
        plants calendar, the garden task list, the garden Drive folder).
        Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, connected, today, plants, supplies, inbox, recent, checks, saving, defaultTime, calendarName, taskListName, folderName, eventPrefix]
      properties:
        type:
          const: jardinStatus
        connected:
          type: boolean
          description: There is a Google session.
        today:
          type: string
          description: YYYY-MM-DD (local).
        plants:
          type: array
          items:
            $ref: '#/components/schemas/JardinPlant'
        supplies:
          type: array
          items:
            $ref: '#/components/schemas/JardinSupply'
        inbox:
          type: array
          items:
            $ref: '#/components/schemas/JardinInboxItem'
        recent:
          type: array
          description: What the office applied by itself lately (notes from the phone, checked tasks), newest first.
          items:
            $ref: '#/components/schemas/JardinRecent'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/JardinCheck'
        saving:
          type: boolean
        syncedAt:
          type: string
          description: ISO time of the last sync with Google.
        defaultTime:
          type: string
          description: HH:MM of a new care's reminder when the owner gives none.
        calendarName:
          type: string
        taskListName:
          type: string
        folderName:
          type: string
        eventPrefix:
          type: string
          description: First word of the reminders' titles, with its colon.
        error:
          type: string

    JardinCareKind:
      type: string
      enum: [regar, abonar, limpiar, podar]

    JardinPlant:
      type: object
      additionalProperties: false
      required: [id, name, photos, cares]
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        place:
          type: string
        notes:
          type: string
        photos:
          type: array
          description: File names under ~/.pixel-agents/jardin/fotos/ (served at /api/jardin/fotos/<name>).
          items:
            type: string
        furniture:
          type: string
          description: The furniture it is drawn as (a uid or a type); it looks thirsty while watering is late.
        cares:
          type: array
          items:
            $ref: '#/components/schemas/JardinCare'

    JardinCare:
      type: object
      additionalProperties: false
      required: [kind, everyDays, time, due, synced]
      properties:
        kind:
          $ref: '#/components/schemas/JardinCareKind'
        everyDays:
          type: integer
        time:
          type: string
          description: HH:MM of the reminder.
        last:
          type: string
          description: YYYY-MM-DD of the last time it was really done.
        due:
          type: string
          description: YYYY-MM-DD when it is due (last + everyDays); before today = late.
        synced:
          type: boolean
          description: Its reminder (event and task) is in Google.

    JardinPlantInput:
      description: A plant as the panel saves it (photos and sync state stay on the server).
      type: object
      additionalProperties: false
      required: [name, cares]
      properties:
        id:
          type: string
          description: Absent for a new plant.
        name:
          type: string
        species:
          type: string
        place:
          type: string
        notes:
          type: string
        furniture:
          type: string
        cares:
          type: array
          items:
            $ref: '#/components/schemas/JardinCareInput'

    JardinCareInput:
      type: object
      additionalProperties: false
      required: [kind, everyDays]
      properties:
        kind:
          $ref: '#/components/schemas/JardinCareKind'
        everyDays:
          type: integer
        time:
          type: string
        last:
          type: string

    JardinSupplyCategory:
      type: string
      enum: [planta, herramienta, tierra, abono, maceta, otro]

    JardinSupply:
      type: object
      additionalProperties: false
      required: [id, name, category, quantity, unit, min, buying]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/JardinSupplyCategory'
        quantity:
          type: number
        unit:
          type: string
        min:
          type: number
        buying:
          type: boolean
          description: A "Comprar ..." task is open in the garden task list.

    JardinSupplyInput:
      type: object
      additionalProperties: false
      required: [name, category, quantity, unit, min]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/JardinSupplyCategory'
        quantity:
          type: number
        unit:
          type: string
        min:
          type: number

    JardinInboxKind:
      type: string
      enum: [note, photo]

    JardinInboxSource:
      type: string
      enum: [drive, local]

    JardinInboxItem:
      description: Something from the phone (Drive) or the computer that the office could not apply by itself.
      type: object
      additionalProperties: false
      required: [id, kind, source, name, receivedAt, why]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/JardinInboxKind'
        source:
          $ref: '#/components/schemas/JardinInboxSource'
        name:
          type: string
          description: The file's name.
        text:
          type: string
        photo:
          type: string
          description: File name under jardin/fotos/ (photos only).
        receivedAt:
          type: string
        why:
          type: string
          description: Why it is waiting.
        newPlant:
          $ref: '#/components/schemas/JardinPlantInput'

    JardinRecent:
      type: object
      additionalProperties: false
      required: [at, text]
      properties:
        at:
          type: string
        text:
          type: string

    JardinCheck:
      type: object
      additionalProperties: false
      required: [id, label, state, detail]
      properties:
        id:
          type: string
        label:
          type: string
        state:
          $ref: '#/components/schemas/ConnectionState'
        detail:
          type: string
        help:
          type: string
          description: How to fix it, when it needs the owner.

    RefreshJardin:
      description: Sync with Google now (calendar, tasks, Drive). Privileged connections only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: refreshJardin

    SaveJardinPlant:
      description: Add or edit a plant, after the owner confirmed what goes to Google. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, plant]
      properties:
        type:
          const: saveJardinPlant
        plant:
          $ref: '#/components/schemas/JardinPlantInput'
        fromInbox:
          type: string
          description: The inbox item this plant came from (it leaves the inbox).

    DeleteJardinPlant:
      description: Remove a plant and the reminders the office made for it. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: deleteJardinPlant
        id:
          type: string

    MarkJardinCare:
      description: The owner did it; the next one is worked out from today. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, plantId, kind]
      properties:
        type:
          const: markJardinCare
        plantId:
          type: string
        kind:
          $ref: '#/components/schemas/JardinCareKind'

    SaveJardinSupply:
      description: Add or edit a garden supply. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, supply]
      properties:
        type:
          const: saveJardinSupply
        supply:
          $ref: '#/components/schemas/JardinSupplyInput'

    DeleteJardinSupply:
      description: Remove a garden supply. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: deleteJardinSupply
        id:
          type: string

    JardinInboxAction:
      type: string
      enum: [care, photo, discard]

    ResolveJardinInbox:
      description: >-
        The owner sorted an inbox item: a note becomes a care done on a plant,
        a photo goes to a plant, or it is thrown away. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, id, action]
      properties:
        type:
          const: resolveJardinInbox
        id:
          type: string
        action:
          $ref: '#/components/schemas/JardinInboxAction'
        plantId:
          type: string
        kind:
          $ref: '#/components/schemas/JardinCareKind'
    # ── Agent searches with criteria (feature: features/busquedas) ─
    # A room (features/directorio today) keeps requests; a Claude Code agent
    # searches the web for each one with the room's criteria and leaves its
    # results in a file the server reads. `room` says whose they are.

    SearchRoomStatus:
      description: >-
        One room's requests, each with what the agent found (sorted, best
        first), the room's criteria sets and whether an agent can be launched
        from the office. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, room, requests, criteria, launcher, saving]
      properties:
        type:
          const: searchRoomStatus
        room:
          type: string
        requests:
          type: array
          items:
            $ref: '#/components/schemas/SearchRequest'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/SearchCriteriaSet'
        launcher:
          $ref: '#/components/schemas/SearchLauncher'
        calendar:
          type: string
          description: >-
            Name of the shared calendar a result is scheduled in. Absent when
            scheduling is not possible right now (no Google session).
        saving:
          type: boolean
          description: Something is being written to Google right now.
        error:
          type: string

    SearchLauncher:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
          description: The office can open a terminal with an agent for a request.
        detail:
          type: string

    SearchRequest:
      type: object
      additionalProperties: false
      required: [id, text, criteriaId, createdAt, state, brief, results]
      properties:
        id:
          type: string
        text:
          type: string
          description: What is needed, as the owner wrote it.
        place:
          type: string
        when:
          type: string
          description: For when, in the owner's words.
        criteriaId:
          type: string
        createdAt:
          type: string
          description: ISO date-time.
        state:
          $ref: '#/components/schemas/SearchRequestState'
        note:
          type: string
          description: What is going on with the agent, or what went wrong.
        brief:
          type: string
          description: One line to paste into any Claude Code session so it takes the request.
        resultsNote:
          type: string
          description: The agent's own note about the search.
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    SearchRequestState:
      description: >-
        nuevo = saved, no agent yet; buscando = an agent has it; esperando =
        the agent waits for the owner in its terminal; listo = results arrived;
        error = the agent could not be launched.
      type: string
      enum: [nuevo, buscando, esperando, listo, error]

    SearchResult:
      type: object
      additionalProperties: false
      required: [id, name, kind, why, score, verdict]
      properties:
        id:
          type: string
          description: Stable across rewrites of the results file (made from the name).
        name:
          type: string
        kind:
          type: string
          description: The room's own classification (directorio - oficial, establecido, otro).
        rating:
          type: number
        reviews:
          type: number
        phone:
          type: string
        address:
          type: string
        link:
          type: string
          description: http(s) only.
        source:
          type: string
        why:
          type: string
          description: Why it is recommended or discarded.
        score:
          type: number
          description: 0-100, by the room's criteria.
        verdict:
          $ref: '#/components/schemas/SearchResultVerdict'
        mark:
          $ref: '#/components/schemas/SearchResultMark'

    SearchResultVerdict:
      description: The agent's verdict by the criteria.
      type: string
      enum: [recomendado, descartado]

    SearchResultMark:
      description: What the owner did with a result.
      type: string
      enum: [contactado, descartado, agendado]

    SearchResultMarkChoice:
      description: A mark the owner sets by hand; ninguno clears it.
      type: string
      enum: [contactado, descartado, ninguno]

    SearchCriteriaSet:
      type: object
      additionalProperties: false
      required: [id, label, rules]
      properties:
        id:
          type: string
        label:
          type: string
        rules:
          type: array
          description: In priority order; the first one weighs most.
          items:
            type: string

    CreateSearchRequest:
      description: Save a new request in a room (no agent is launched yet). Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, room, text, criteriaId]
      properties:
        type:
          const: createSearchRequest
        room:
          type: string
        text:
          type: string
        place:
          type: string
        when:
          type: string
        criteriaId:
          type: string

    LaunchSearchAgent:
      description: >-
        Open a terminal with a Claude Code agent (normal permissions) that
        takes the request, or hand the request again to the agent that is
        waiting. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, room, id]
      properties:
        type:
          const: launchSearchAgent
        room:
          type: string
        id:
          type: string

    MarkSearchResult:
      description: Mark a result as contacted or discarded (ninguno clears it). Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, room, requestId, resultId, mark]
      properties:
        type:
          const: markSearchResult
        room:
          type: string
        requestId:
          type: string
        resultId:
          type: string
        mark:
          $ref: '#/components/schemas/SearchResultMarkChoice'

    DeleteSearchRequest:
      description: Forget a request and its results. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, room, id]
      properties:
        type:
          const: deleteSearchRequest
        room:
          type: string
        id:
          type: string

    SaveSearchCriteria:
      description: Replace a room's criteria sets. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, room, criteria]
      properties:
        type:
          const: saveSearchCriteria
        room:
          type: string
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/SearchCriteriaSet'

    ScheduleSearchResult:
      description: >-
        Add the event the owner reviewed and confirmed for a result to the
        shared calendar, then mark the result agendado. Privileged
        connections only.
      type: object
      additionalProperties: false
      required: [type, room, requestId, resultId, title, date]
      properties:
        type:
          const: scheduleSearchResult
        room:
          type: string
        requestId:
          type: string
        resultId:
          type: string
        title:
          type: string
          description: The whole title, type prefix included.
        date:
          type: string
          description: YYYY-MM-DD (local).
        time:
          type: string
          description: HH:MM (local); absent = all-day.

    # ── Outside connections (feature: features/conexiones) ────────

    ConnectionsStatus:
      description: >-
        Every outside service the office talks to (web APIs, local CLIs), as
        each feature reports it: what it is for, how it signs in and whether it
        works right now. No keys or tokens, only their state. Privileged
        connections only.
      type: object
      additionalProperties: false
      required: [type, connections]
      properties:
        type:
          const: connectionsStatus
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionInfo'

    ConnectionInfo:
      type: object
      additionalProperties: false
      required: [id, name, feature, purpose, auth, state]
      properties:
        id:
          type: string
        name:
          type: string
        feature:
          type: string
          description: The office feature that uses it (e.g. "Música").
        purpose:
          type: string
        auth:
          type: string
          description: How it signs in (OAuth, API key, the CLI's own login, none).
        state:
          $ref: '#/components/schemas/ConnectionState'
        detail:
          type: string
        lastUsedAt:
          type: string
          description: ISO time of the last successful call.

    ConnectionState:
      description: >-
        ok = working; warn = expiring soon or failing; off = no key or not
        connected; idea = planned, no code yet.
      type: string
      enum: [ok, warn, off, idea]

    GithubPullRequest:
      type: object
      additionalProperties: false
      required: [repo, number, title, url]
      properties:
        repo:
          type: string
        number:
          type: number
        title:
          type: string
        url:
          type: string
        author:
          type: string

    HerdrTabLabels:
      description: >-
        The name of the herdr terminal tab each agent's Claude session runs in,
        shown above the character instead of its folder. Agents not in herdr
        are left out. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type, labels]
      properties:
        type:
          const: herdrTabLabels
        labels:
          type: object
          description: Map of agent ID (string) to herdr tab name.
          additionalProperties:
            type: string

    UsageProfile:
      type: object
      additionalProperties: false
      required: [profile, sessions]
      properties:
        profile:
          description: Name of the profile file (e.g. personal).
          type: string
        updatedAt:
          type: string
        fiveHour:
          $ref: '#/components/schemas/UsageLimit'
        sevenDay:
          $ref: '#/components/schemas/UsageLimit'
        otherLimits:
          description: >-
            Any other plan limit the statusline reports (e.g. a weekly limit
            for one model), keyed as Claude Code names it.
          type: array
          items:
            $ref: '#/components/schemas/UsageNamedLimit'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/UsageSession'

    UsageLimit:
      type: object
      additionalProperties: false
      required: [pct]
      properties:
        pct:
          description: Percent of the limit used (0-100).
          type: number
        resetsAt:
          type: string

    UsageNamedLimit:
      type: object
      additionalProperties: false
      required: [key, pct]
      properties:
        key:
          description: The rate_limits key, e.g. seven_day_fable.
          type: string
        pct:
          type: number
        resetsAt:
          type: string

    UsageSession:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
        folder:
          type: string
        model:
          type: string
        costUsd:
          description: Estimated by Claude Code at list price (not the bill).
          type: number
        tokens:
          type: integer
        contextPct:
          type: integer
        updatedAt:
          type: string

    MusicStatus:
      description: >-
        Music feature settings and Spicetify extension state. `token` (the
        music-only bearer token the extension sends) and the install outcome
        reach privileged connections only.
      type: object
      additionalProperties: false
      required: [type, enabled, spicetifyFound, extensionInstalled]
      properties:
        type:
          const: musicStatus
        enabled:
          type: boolean
        spicetifyFound:
          type: boolean
        extensionInstalled:
          type: boolean
        controls:
          description: The extension is connected for playback control (previous / play-pause / next).
          type: boolean
        token:
          type: string
        message:
          description: Outcome of the last install attempt, to show the user.
          type: string
        spotifyConfigured:
          description: music.json has a Spotify client id, so the office can connect to the account.
          type: boolean
        spotifyConnected:
          description: >-
            There is a Spotify session: the office follows the account's playback even with Spotify
            closed on this computer.
          type: boolean
        source:
          description: Where the current track comes from.
          type: string
          enum: [extension, spotify]

    RefreshConcerts:
      description: Read the concerts calendar again now. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: refreshConcerts

    SearchConcerts:
      description: Look for concerts in Mexico of the most listened artists. Privileged only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: searchConcerts

    AddConcert:
      description: Add a found concert (its id in concertsStatus.found) to the calendar. Privileged only.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: addConcert
        id:
          type: string

    DisconnectGoogle:
      description: Forget the Google Calendar session. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: disconnectGoogle

    DisconnectSpotify:
      description: Forget the Spotify session (Web API). Privileged connections only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: disconnectSpotify

    SetMusicEnabled:
      description: Show or hide the music column and the turntable animation.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setMusicEnabled
        enabled:
          type: boolean

    MusicControl:
      description: >-
        Playback control relayed to the Spotify extension. Privileged
        connections only.
      type: object
      additionalProperties: false
      required: [type, action]
      properties:
        type:
          const: musicControl
        action:
          type: string
          enum: [previous, togglePlay, next]

    InstallMusicExtension:
      description: >-
        Write the Spicetify extension (with the music token baked in) into the
        Spicetify extensions folder and enable it. Privileged connections only.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: installMusicExtension

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
